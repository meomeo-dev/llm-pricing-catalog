[[billing_unit]]
unit_id = "openrouter-credit"
kind = "platform_credit"
issuer_org_id = "openrouter"
description = "OpenRouter 额度：按美元面值扣减推理费用，购买时另收手续费"

[[billing_unit]]
unit_id = "vercel-ai-gateway-credit"
kind = "platform_credit"
issuer_org_id = "vercel"
description = "Vercel AI Gateway 额度：按美元面值扣减推理费用"

[[billing_unit]]
unit_id = "copilot-ai-credit"
kind = "tool_credit"
issuer_org_id = "github"
description = "GitHub Copilot AI credit：按 token 标价折算的用量单位，1 AI credit = 0.01 USD"

[[billing_unit]]
unit_id = "copilot-premium-request"
kind = "request"
issuer_org_id = "github"
description = "GitHub Copilot premium request：年付旧制按请求 × 模型倍率扣减"

[[billing_unit]]
unit_id = "kiro-credit"
kind = "tool_credit"
issuer_org_id = "aws"
description = "Kiro credit：按相对 Auto 的模型倍率扣减"

[[billing_unit]]
unit_id = "openai-codex-credit"
kind = "platform_credit"
issuer_org_id = "openai"
description = "ChatGPT / Codex credits：按模型的 credits / 百万 token 扣减"

[[billing_unit]]
unit_id = "anthropic-ccu"
kind = "platform_credit"
issuer_org_id = "anthropic"
description = "Claude Consumption Unit：经云市场（Azure Marketplace、AWS Marketplace）开票的计量单位，100 CCU = 1 USD"

[[meter]]
meter_id = "input"
quantity_unit = "token"
per_quantity = 1000000
description = "输入 token（未命中缓存）；区分模态时指文本、图像、视频输入"

[[meter]]
meter_id = "input_audio"
quantity_unit = "token"
per_quantity = 1000000
description = "音频输入 token"

[[meter]]
meter_id = "output"
quantity_unit = "token"
per_quantity = 1000000
description = "输出 token，含推理 token"

[[meter]]
meter_id = "cache_read"
quantity_unit = "token"
per_quantity = 1000000
description = "缓存命中读取"

[[meter]]
meter_id = "cache_read_audio"
quantity_unit = "token"
per_quantity = 1000000
description = "音频的缓存命中读取"

[[meter]]
meter_id = "cache_write_5m"
quantity_unit = "token"
per_quantity = 1000000
description = "缓存写入，5 分钟 TTL"

[[meter]]
meter_id = "cache_write_1h"
quantity_unit = "token"
per_quantity = 1000000
description = "缓存写入，1 小时 TTL"

[[meter]]
meter_id = "cache_write"
quantity_unit = "token"
per_quantity = 1000000
description = "缓存写入，页面未区分 TTL"

[[meter]]
meter_id = "cache_storage"
quantity_unit = "token_hour"
per_quantity = 1000000
description = "缓存存储，每百万 token 每小时"

[[meter]]
meter_id = "request"
quantity_unit = "request"
per_quantity = 1
description = "按请求计；金额为每次请求扣减的单位数（如 premium request 倍率）"

[[meter]]
meter_id = "relative_usage"
quantity_unit = "relative"
per_quantity = 1
description = "相对渠道基准用量的倍率（Kiro 以 Auto 为 1x）；基准用量不公开，只能在渠道内横比"
